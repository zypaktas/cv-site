<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeynep Sudem Aktaş · CV</title>
<style>
  :root { --bg:#faf7f2; --ink:#1f2430; --muted:#6b7280; --accent:#b4432f; --card:#ffffff; --line:#e7e1d8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  header { padding:72px 24px 40px; max-width:820px; margin:0 auto; }
  h1 { font-size:2.6rem; margin:0 0 6px; letter-spacing:-0.02em; }
  .title { font-family: system-ui, sans-serif; color:var(--accent); font-weight:600; margin:0 0 14px; }
  .meta { font-family: system-ui, sans-serif; color:var(--muted); font-size:.92rem; }
  .meta a { color:var(--ink); }
  main { max-width:820px; margin:0 auto; padding:0 24px 120px; }
  section { margin-top:40px; }
  h2 { font-family: system-ui, sans-serif; text-transform:uppercase; letter-spacing:.12em; font-size:.8rem; color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:8px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin:12px 0; }
  .item h3 { margin:0; font-size:1.05rem; }
  .item .sub { font-family: system-ui, sans-serif; color:var(--muted); font-size:.88rem; }
  .item ul { margin:6px 0 0; padding-left:20px; }
  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { font-family: system-ui, sans-serif; font-size:.85rem; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; }
  /* chat */
  #chat-btn { position:fixed; right:20px; bottom:20px; width:58px; height:58px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:26px; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  #chat { position:fixed; right:20px; bottom:92px; width:360px; max-width:calc(100vw - 40px); height:480px; max-height:calc(100vh - 120px); background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.2); display:none; flex-direction:column; font-family: system-ui, sans-serif; overflow:hidden; }
  #chat.open { display:flex; }
  #chat-head { background:var(--ink); color:#fff; padding:12px 16px; font-weight:600; font-size:.95rem; }
  #chat-head small { display:block; font-weight:400; opacity:.7; }
  #msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:85%; padding:9px 12px; border-radius:12px; font-size:.92rem; white-space:pre-wrap; }
  .m.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:3px; }
  .m.bot { align-self:flex-start; background:#f1ede6; border-bottom-left-radius:3px; }
  .typing { display:inline-flex; gap:4px; align-items:center; height:18px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:#9a948a; animation: bl 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes bl { 0%,80%,100% { opacity:.25; transform:translateY(0);} 40% { opacity:1; transform:translateY(-3px);} }
  .hint { font-size:.78rem; opacity:.7; margin-top:6px; }
  #chat form { display:flex; border-top:1px solid var(--line); }
  #chat input { flex:1; border:none; padding:14px; font-size:.95rem; outline:none; }
  #chat form button { border:none; background:none; color:var(--accent); font-weight:700; padding:0 16px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <p class="title" id="title"></p>
  <p id="summary"></p>
  <p class="meta"><span id="loc"></span> · <a id="mail"></a> · <a id="li" target="_blank" rel="noopener">LinkedIn</a> · <a id="gh" target="_blank" rel="noopener">GitHub</a></p>
</header>
<main>
  <section><h2>Education</h2><div id="education"></div></section>
  <section><h2>Experience</h2><div id="experience"></div></section>
  <section><h2>Leadership &amp; Activities</h2><div id="leadership"></div></section>
  <section><h2>Awards &amp; Scholarships</h2><div id="awards"></div></section>
  <section><h2>Skills</h2><div class="tags" id="skills"></div></section>
  <section><h2>Languages</h2><div class="tags" id="languages"></div></section>
</main>

<button id="chat-btn" aria-label="Open chat">💬</button>
<div id="chat">
  <div id="chat-head">Ask about Sudem<small>AI assistant · answers from her CV</small></div>
  <div id="msgs"></div>
  <form id="form"><input id="input" placeholder="Ask anything… / Bir şey sor…" autocomplete="off"><button>Send</button></form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

fetch("/api/cv").then(r => r.json()).then(cv => {
  $("name").textContent = cv.name;
  $("title").textContent = cv.title;
  $("summary").textContent = cv.summary;
  $("loc").textContent = cv.location;
  $("mail").textContent = cv.email; $("mail").href = "mailto:" + cv.email;
  $("li").href = cv.linkedin; $("gh").href = cv.github;
  const block = (x) => `<div class="item"><h3>${esc(x.title)}</h3>${x.period ? `<div class="sub">${esc(x.period)}</div>` : ""}<ul>${x.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`;
  $("education").innerHTML = cv.education.map(block).join("");
  $("experience").innerHTML = cv.experience.map(block).join("");
  $("leadership").innerHTML = cv.leadership.map(block).join("");
  $("awards").innerHTML = cv.awards.map(a => `<div class="item">${esc(a)}</div>`).join("");
  $("skills").innerHTML = cv.skills.map(x => `<span class="tag">${esc(x)}</span>`).join("");
  $("languages").innerHTML = cv.languages.map(x => `<span class="tag">${esc(x)}</span>`).join("");
});

// chat
const history = [];
const add = (role, text) => { const d = document.createElement("div"); d.className = "m " + role; d.textContent = text; $("msgs").appendChild(d); $("msgs").scrollTop = 1e9; return d; };
$("chat-btn").onclick = () => { $("chat").classList.toggle("open"); if (!history.length) add("bot", "Hi! I can answer questions about Sudem's education, experience and projects. Merhaba, Türkçe de sorabilirsin."); $("input").focus(); };
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim(); if (!text) return;
  $("input").value = ""; add("user", text); history.push({ role: "user", text });
  const wait = add("bot", "");
  wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  const slow = setTimeout(() => { wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span><div class="hint">Waking up the server, this can take up to a minute on the first message… / Sunucu uyanıyor, ilk mesajda 1 dakikaya kadar sürebilir.</div>'; }, 6000);
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }), signal: AbortSignal.timeout(90000) });
    clearTimeout(slow);
    const data = await r.json();
    const reply = r.ok ? data.reply : (data.error || "Error");
    wait.textContent = reply; history.push({ role: "bot", text: reply });
  } catch { clearTimeout(slow); wait.textContent = "Connection error. Please try again."; }
};
</script>
</body>
</html>
